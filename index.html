<!doctype html>
<!-- WHY: class="dark" hardcoded: the site is dark-only by design, no toggle; color-scheme tells the browser so form controls and scrollbars match. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- WHY: a manifest makes the site installable to a phone home screen as a standalone app; iOS ignores manifest
         icons and reads apple-touch-icon instead, hence the PNG. Paths carry the Pages base path. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Launches</title>
    <meta name="color-scheme" content="dark" />
    <!-- WHY: mobile browser chrome takes this colour; it must match --background or the page gets a visible seam. -->
    <meta name="theme-color" content="#0d0d0d" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
